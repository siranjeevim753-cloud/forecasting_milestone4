{% extends "base.html" %}
{% block content %}

<div class="row g-4">
    <div class="col-lg-8">
        <div class="form-card">
            <h5 class="mb-4 font-head">🏢 Company & System Settings</h5>
            <form method="POST" action="{{ url_for('settings.index') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="company_name" value="{{ s.get('company_name', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Company Email</label>
                        <input type="email" class="form-control" name="company_email" value="{{ s.get('company_email', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" name="company_phone" value="{{ s.get('company_phone', '') }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Currency</label>
                        <input type="text" class="form-control" name="currency" value="{{ s.get('currency', 'INR') }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Currency Symbol</label>
                        <input type="text" class="form-control" name="currency_symbol" value="{{ s.get('currency_symbol', '₹') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tax Rate (%)</label>
                        <input type="number" step="0.1" class="form-control" name="tax_rate" value="{{ s.get('tax_rate', '18') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Low Stock Threshold</label>
                        <input type="number" class="form-control" name="low_stock_threshold" value="{{ s.get('low_stock_threshold', '10') }}" min="1" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="company_address" rows="3">{{ s.get('company_address', '') }}</textarea>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="stat-card mb-4">
            <h6 class="font-head mb-3">ℹ️ System Info</h6>
            <div class="d-flex justify-content-between py-2 border-bottom"><span class="text-secondary">App Version</span><strong>v{{ app_version }}</strong></div>
            <div class="d-flex justify-content-between py-2 border-bottom"><span class="text-secondary">Backend</span><strong>Python / Flask</strong></div>
            <div class="d-flex justify-content-between py-2 border-bottom"><span class="text-secondary">Database</span><strong>SQLite</strong></div>
            <div class="d-flex justify-content-between py-2 border-bottom"><span class="text-secondary">Server Time</span><strong>{{ server_time }}</strong></div>
        </div>
    </div>
</div>

{% endblock %}
